<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>particle-logo-canvas — Minimal 2D Canvas Demo</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #000; color: #e4e4e7; font-family: system-ui, sans-serif; display: grid; place-items: center; }
    .wrap { width: min(92vw, 460px); text-align: center; }
    .stage { width: 100%; height: 400px; border-radius: 18px; background: #050507; border: 1px solid rgba(255,255,255,.12); overflow: hidden; cursor: crosshair; }
    .bar { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    button, a { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font-size: 13px; text-decoration: none; cursor: pointer; }
    a.primary { background: #fff; color: #000; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage" class="stage"></div>
    <div class="bar">
      <button type="button" data-v="condense">Condense</button>
      <button type="button" data-v="mobius-flow">Mobius Flow</button>
      <button type="button" data-v="vortex">Vortex</button>
      <a class="primary" href="https://particlelogo.com/workbench" target="_blank" rel="noopener">Upload Your Logo →</a>
    </div>
  </div>
  <script type="module">
    import { createParticleLogo, sampleSvgPath } from './particle-logo.js';

    const REACT_PATH = 'M14.23 12.004a2.236 2.236 0 0 1-2.235 2.236 2.236 2.236 0 0 1-2.236-2.236 2.236 2.236 0 0 1 2.235-2.236 2.236 2.236 0 0 1 2.236 2.236zm2.648-10.69c-1.346 0-3.107.96-4.888 2.622-1.78-1.653-3.542-2.602-4.887-2.602-.41 0-.783.093-1.106.278-1.375.793-1.683 3.264-.973 6.365C1.98 8.917 0 10.42 0 12.004c0 1.59 1.99 3.097 5.043 4.03-.704 3.113-.39 5.588.988 6.38.32.187.69.275 1.102.275 1.345 0 3.107-.96 4.888-2.624 1.78 1.654 3.542 2.603 4.887 2.603.41 0 .783-.09 1.106-.275 1.374-.792 1.683-3.263.973-6.365C22.02 15.096 24 13.59 24 12.004c0-1.59-1.99-3.097-5.043-4.032.704-3.11.39-5.587-.988-6.38-.318-.184-.688-.277-1.092-.278z';
    const points = sampleSvgPath(REACT_PATH, { step: 5 });
    const app = createParticleLogo(document.getElementById('stage'), {
      points,
      variant: 'vortex',
      colors: ['#61DAFB', '#ffffff', '#cbd5e1']
    });

    document.querySelectorAll('[data-v]').forEach((btn) => {
      btn.addEventListener('click', () => app.setVariant(btn.dataset.v));
    });
  </script>
</body>
</html>
